name: validate

on:
  push:
  pull_request:
  # Callable, so `release.yml` gates a publish on THIS suite rather than on a copy
  # of it. A second home for the gate is a gate that drifts at one of them.
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests — the same entry point a human uses
        run: npm test

      - name: Negative self-test — every guard watched refusing its own defect
        # The half that makes the validator a gate. It plants each defect in a
        # copy of the tree and fails if the validator still passes.
        run: npm run test:negatives

      - name: The fixtures' mutant matrix
        # Stated separately from `npm test` because a green fixture whose mutants
        # cannot kill it proves nothing, and the distinction is worth seeing in
        # the run's own step list.
        run: |
          python3 plugins/telegram-dev/skills/telegram-bots/fixtures/update_delivery.py --self-test
          python3 plugins/telegram-dev/skills/telegram-miniapps/fixtures/verify_initdata.py

      - name: Manifests — both strict validations
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/telegram-dev --strict

      - name: The installer runs against a fresh HOME, and the rerun skips
        run: |
          set -eu
          # Asserted against the tree, not against a written list: a fourth skill
          # is covered without editing this step. The installer takes no flags
          # beyond --force and --help; passing one it does not know exits 2, which
          # is how this step first went red.
          NAMES="$(ls -1 plugins/telegram-dev/skills)"
          export HOME="$(mktemp -d)"
          node bin/telegram-dev.js
          for n in $NAMES; do
            test -f "$HOME/.claude/skills/$n/SKILL.md" || { echo "missing: $n"; exit 1; }
          done
          test -f "$HOME/.claude/skills/telegram-miniapps/fixtures/verify_initdata.py"
          python3 "$HOME/.claude/skills/telegram-miniapps/fixtures/verify_initdata.py"
          # A second run must not rewrite what is already there.
          node bin/telegram-dev.js | grep -q 'skip' \
            || { echo "the rerun did not skip anything"; exit 1; }
          echo "OK: $(echo "$NAMES" | wc -w | tr -d ' ') skills installed, rerun skipped"

      - name: What npm would publish
        run: npm pack --dry-run

  skill-audit:
    name: House skill audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the pinned family auditor
        uses: actions/checkout@v4
        with:
          repository: ssheleg/make-skill
          ref: 991cbb415be3e856f05c974e631423df552883e3
          path: .skill-auditor
          persist-credentials: false

      - name: Audit every shipped Agent Skill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          auditor = Path(".skill-auditor/plugins/make-skill/skills/make-skill/scripts/audit_skill.py")
          skills = sorted({
              *Path(".").glob("plugins/*/skills/*/SKILL.md"),
              *Path(".").glob("skills/*/SKILL.md"),
          })
          if not skills:
              raise SystemExit("no shipped SKILL.md found")
          for manifest in skills:
              subprocess.run(
                  [sys.executable, str(auditor), "--house", str(manifest.parent)],
                  check=True,
              )
          print(f"OK: {len(skills)} shipped skill(s) passed the pinned house audit")
          PY

      - name: Validate behavioral eval data and watch the guard fail
        run: |
          python3 test/evals_validate.py
          python3 test/evals_validate.py --self-test

      - name: Validate the committed social preview
        run: python3 test/social_preview.py
